<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="./icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-title" content="うちっぱなし">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c140a">
<title>うちっぱなし</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="board"><div class="bl" id="hl">じゆうれんしゅう</div><div class="aimt" id="aimt" hidden><span class="dot" id="aimdot"></span><span id="aimtt"></span></div></div>
    <div class="pill wind" id="hw"><small>かぜ</small><svg viewBox="0 0 20 20" id="wa"><path d="M10 1 L17 10 H12.5 V19 H7.5 V10 H3 Z" fill="#7fd3ff"/></svg><span id="wv">0m</span></div>
  </div>
  <div class="dial hide" id="dial"><svg id="arc" viewBox="0 0 200 200" aria-hidden="true"><g id="arcbg"></g><path id="afill" fill="none" stroke-width="16" stroke-linecap="round"/><path id="azone" fill="none" stroke="#ffd23f" stroke-width="22" stroke-linecap="round"/><path d="M100 189 l-10 15 h20 z" fill="#ffd23f" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/><g id="amk"><circle r="11" fill="#fff" stroke="#111" stroke-width="2.5"/><circle r="4" fill="#111"/></g></svg><div class="dc"><b id="dyd"></b><small id="dys"></small></div></div>
  <div class="live" id="live"><b id="lvn">0</b><span>y</span></div>
  <div class="combo" id="combo"></div>
  <div class="pop" id="pop"><div class="rib" id="pt"></div><div class="pbody"><svg id="pmap" viewBox="0 0 100 100" aria-hidden="true"></svg><div class="pnum"><div class="big"><b id="pb">0</b><span id="pu">てん</span></div><div class="stars" id="pst"></div></div></div><div class="s" id="ps"></div></div>
  <div class="panel" id="panel">
    <div class="clubs" id="clubs"></div>
    <div class="ctrl">
      <button class="ab" id="aL" aria-label="ひだりをねらう">◀</button>
      <button class="sw idle" id="sw"><b id="swb">スイング</b><small id="sws">ながおし</small></button>

      <button class="ab" id="aR" aria-label="みぎをねらう">▶</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<div class="ov" id="title">
  <div class="card">
    <h1>うちっぱなし</h1>
    <p>かぜを見て、ねらって、カキーン!</p>
    <div class="how"><div><b>1</b>◀ ▶ で<br>ねらう</div><div><b>2</b>ボタンながおしで<br>パワー</div><div><b>3</b>▲にきたら<br>タップ</div></div>
    <button class="btn" id="bC">ねらいうち(10球)</button>
    <button class="btn sub" id="bF">じゆうれんしゅう</button>
    <button class="btn sub" id="bP">パターゴルフ (9ホール)</button>
    <div class="row"><span id="best">ベスト ―</span><button class="snd" id="bS">おと:オン</button></div>
  </div>
</div>

<div class="ov" id="over" hidden>
  <div class="card">
    <div class="ovt"><small>ねらいうち 10球</small>おわり! けっかはっぴょう</div>
    <div class="rwrap"><div class="res"><b id="rs">0</b><span>てん</span></div><div class="stamp" id="rr"></div></div>
    <div class="shots" id="rl"></div>
    <div class="stats" id="rst"></div>
    <div class="newbest" id="rb"></div>
    <div class="rbtn" id="rbtn"><button class="btn" id="bA">もう一回</button><button class="btn sub" id="bT">タイトルへ</button></div>
    <div class="skip" id="rskip">タップでとばす</div>
  </div>
</div>

<div id="putt" hidden>
  <div id="pbg"></div>
  <canvas id="pc"></canvas>
  <div class="hud">
    <div class="board"><div class="bl" id="phl"></div><div class="aimt" id="phs"></div></div>
    <div class="pill pslope" id="pslope"><small>かたむき</small><svg viewBox="0 0 20 20"><path d="M10 1 L17 10 H12.5 V19 H7.5 V10 H3 Z" fill="#7fd3ff"/></svg><span></span></div>
  </div>
  <button class="pquit" id="pquit">やめる</button>
  <div class="pop pcard" id="ppop"><div class="rib" id="ppt"></div><div class="pbody"><div class="pnum"><div class="big"><b id="ppn">0</b><span>打</span></div></div></div><div class="s" id="pps"></div></div>
  <div class="pgauge" id="pgauge" hidden><div class="pgbar"><div class="pgfill" id="pgfill"></div><div class="pgmark" id="pgmark"><span>カップ</span></div></div><small>つよさ</small></div>
  <button class="sw pshot" id="pshot" hidden><b>うつ</b><small>ゲージ</small></button>
  <div class="phint" id="phint"></div>
  <div class="ov" id="pover" hidden>
    <div class="card">
      <div class="ovt"><small>パターゴルフ 9ホール</small>おわり! けっか</div>
      <div class="rwrap"><div class="res"><b id="pres">0</b><span>打</span></div><div class="stamp" id="prank"></div></div>
      <div class="ppar" id="ppar"></div>
      <div class="pcards" id="pcards"></div>
      <div class="newbest on" id="pbest"></div>
      <div class="rbtn on"><button class="btn" id="pagain">もう一回</button><button class="btn sub" id="ptitle">タイトルへ</button></div>
    </div>
  </div>
</div>
<script src="./app.js"></script>
<script src="./putt-core.js"></script>
<script src="./putt.js"></script>
</body>
</html>
